name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — tsc --noEmit em api, next lint em web, tsc --noEmit em packages/core
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — api
        run: pnpm --filter api lint

      - name: Lint — web
        run: pnpm --filter web lint

      - name: Lint — packages/core
        working-directory: packages/core
        run: |
          npm ci
          npm run lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — packages/core (Jest, standalone npm project, ~100% coverage)
  # ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Test — packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install and test
        working-directory: packages/core
        run: |
          npm ci
          npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — packages/ui (Vitest, pnpm workspace)
  # ─────────────────────────────────────────────────────────────────────────────
  test-ui:
    name: Test — packages/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test — packages/ui
        run: pnpm --filter "@databolsa/ui" test

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — API (Jest + PostgreSQL service container)
  # ─────────────────────────────────────────────────────────────────────────────
  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: databolsa
          POSTGRES_PASSWORD: databolsa
          POSTGRES_DB: databolsa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://databolsa:databolsa@localhost:5432/databolsa_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      USE_QUOTE_STUB: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate

      - name: Run database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Test — api
        run: pnpm --filter api test

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — API (nest build)
  # ─────────────────────────────────────────────────────────────────────────────
  build-api:
    name: Build — API
    runs-on: ubuntu-latest
    needs: [lint, test-api]
    env:
      DATABASE_URL: postgresql://databolsa:databolsa@localhost:5432/databolsa_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate

      - name: Build API
        run: pnpm --filter api build

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — Web (next build)
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build — Web
    runs-on: ubuntu-latest
    needs: [lint, test-ui]
    env:
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter web build

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next
          # output:standalone gera .next/standalone/ — incluímos tudo
          path: apps/web/.next
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate Specs — ajv-cli valida todos os JSON de specs contra o schema
  # ─────────────────────────────────────────────────────────────────────────────
  validate-specs:
    name: Validate Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install root devDependencies
        run: pnpm install --frozen-lockfile

      - name: Validate spec JSON files
        run: pnpm run validate-specs

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E — Playwright golden path + cenário negativo
  # Depende de build-api e build-web para ter os artefatos compilados.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: databolsa
          POSTGRES_PASSWORD: databolsa
          POSTGRES_DB: databolsa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://databolsa:databolsa@localhost:5432/databolsa_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      USE_QUOTE_STUB: 'true'
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download API build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-next
          path: apps/web/.next

      # output:standalone — copiar assets estáticos para o servidor standalone
      - name: Prepare Next.js standalone assets
        run: |
          cp -r apps/web/public apps/web/.next/standalone/public 2>/dev/null || true
          cp -r apps/web/.next/static apps/web/.next/standalone/.next/static 2>/dev/null || true

      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate

      - name: Run database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright traces and screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
