name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Test — packages/core (Jest, standalone npm project, ~100% coverage)
  # ─────────────────────────────────────────────────────────────────────────────
  test-core:
    name: Test — packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install and test
        working-directory: packages/core
        run: |
          npm ci
          npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Test — packages/ui (Vitest, pnpm workspace)
  # ─────────────────────────────────────────────────────────────────────────────
  test-ui:
    name: Test — packages/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test — packages/ui
        run: pnpm --filter "@databolsa/ui" test

  # ─────────────────────────────────────────────────────────────────────────────
  # Build — Web (next build)
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build — Web
    runs-on: ubuntu-latest
    needs: [test-ui]
    env:
      API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter web build

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-next
          # output:standalone gera .next/standalone/ — incluímos tudo
          path: apps/web/.next
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Validate Specs — ajv-cli valida todos os JSON de specs contra o schema
  # ─────────────────────────────────────────────────────────────────────────────
  validate-specs:
    name: Validate Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install root devDependencies
        run: pnpm install --frozen-lockfile

      - name: Validate spec JSON files
        run: pnpm run validate-specs
