services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-databolsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databolsa}
      POSTGRES_DB: ${POSTGRES_DB:-databolsa_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-databolsa} -d ${POSTGRES_DB:-databolsa_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_URL: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-databolsa}:${POSTGRES_PASSWORD:-databolsa}@postgres:5432/${POSTGRES_DB:-databolsa_dev}
      DIRECT_URL: postgres://${POSTGRES_USER:-databolsa}:${POSTGRES_PASSWORD:-databolsa}@postgres:5432/${POSTGRES_DB:-databolsa_dev}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
