# Overrides de desenvolvimento: monta o código-fonte nos containers para hot-reload.
# Aplicado automaticamente junto com docker-compose.yml em `docker compose up`.
# Em produção, NÃO usar este arquivo.
services:
  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust

  web:
    build:
      target: dev
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
      - ./apps/web/public:/app/apps/web/public:ro
    command: pnpm --filter web run dev
