name: databolsa_mobile
description: "DataBolsa — personal investment portfolio tracker (mobile Flutter client)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.69.0

  # Decimal arithmetic — NEVER float for money
  decimal: ^3.2.1

  # Internationalisation / number formatting
  intl: ^0.19.0

  # Fonts (IBM Plex Mono / IBM Plex Sans via google_fonts)
  google_fonts: ^6.2.1

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.5

  # Mocking in tests
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
